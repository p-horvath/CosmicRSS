[package]
name = "cosmic-rss"
version = "0.1.0"
edition = "2021"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = ["winit", "tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["default"] }
rss = "2"
atom_syndication = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
futures = "0.3"
